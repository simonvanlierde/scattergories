[build-system]
  build-backend = "uv_build"
  requires      = ["uv_build>=0.11.28,<0.14"]

[project]
  dependencies    = ['datasets>=5.0.0', 'tqdm>=4.68.4', 'typer>=0.26.7']
  description     = 'Internal Python tooling for Scattergories locale assets and data workflows'
  name            = 'scattergories-tools'
  readme          = 'README.md'
  requires-python = '>=3.14'
  version         = '0.2.0'
  # PyPI rejects unknown classifiers, so this one blocks an accidental upload.
  classifiers = ['Private :: Do Not Upload']

  [project.scripts]
    sg-tools = 'scattergories_tools.cli:main'

[dependency-groups]
  dev         = ['pytest>=9.1.1', 'pytest-cov>=7.1.0', 'ruff>=0.15.21', 'ty>=0.0.58', "uv-build>=0.11.28,<0.14"]

# Resolve only releases at least a week old: a compromised release is usually
# caught and yanked within that window. The dependency bot waits the same week.
# Set here, not user-wide, so every machine writes the same uv.lock.
[tool.uv]
  exclude-newer = '1 week'
  # certifi 2026.10.19 removes the compromised emSign roots (PYSEC-2026-4320); it is
  # inside the week above. Drop this once that release is a week old (2026-10-27).
  exclude-newer-package = { certifi = '2026-10-21T00:00:00Z' }

[tool.pytest.ini_options]
  addopts = [
    '--cov-branch',
    '--cov-report=term-missing',
    '--cov=src/scattergories_tools',
    '--strict-config',
    '--strict-markers',
    '--tb=short',
    '-q',
  ]
  testpaths = ['tests']

[tool.ruff]
  extend-exclude               = ['.venv', '.cache', 'out']
  format.docstring-code-format = true
  line-length                  = 120
  src                          = ['src', 'tests']
  target-version               = 'py314'

  [tool.ruff.lint]
    fixable = ['ALL']

    ignore = [
      # Avoid conflicts with the formatter
      "COM812", # missing-trailing-comma

      # Overly strict rules
      "ANN204", # missing-return-type-special-method
      "D105",   # undocumented-magic-method
      "D107",   # undocumented-public-init
      "CPY001", # We don't use file-level copyright notices
    ]
    select = ['ALL']

    [tool.ruff.lint.pydocstyle]
      convention = 'google'

    [tool.ruff.lint.per-file-ignores]
      'tests/**/*.py' = ['S101']

# A rule set to "warn" reports without failing: ty otherwise exits 1 on warnings too.
[tool.ty.terminal]
  error-on-warning = false
