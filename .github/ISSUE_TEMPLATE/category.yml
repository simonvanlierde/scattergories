name: Category suggestion
description: Propose a category or pack for review
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        A suggestion is a proposal. Only categories the maintainer has reviewed enter the built-in packs.
        See [Contributing](https://github.com/simonvanlierde/scattergories/blob/main/.github/CONTRIBUTING.md#suggest-a-category) for the review steps.
  - type: input
    id: wording
    attributes:
      label: Category wording
      description: The category as players read it, for example "Things in a Garage".
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language
      description: The language of the wording. Say if it should exist in every language.
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Audience
      options:
        - All ages
        - Young players
        - Adults only
    validations:
      required: true
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      description: How hard it is to find an answer for most letters.
      options:
        - Easy
        - Medium
        - Hard
    validations:
      required: true
  - type: input
    id: pack
    attributes:
      label: Pack
      description: The built-in pack it fits, or a new pack you propose.
  - type: textarea
    id: examples
    attributes:
      label: Example answers
      description: Answers for at least three different letters, one per line.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source and permission
      description: Say you wrote the category yourself. If it comes from a game, book or list, name it and say whether you may share it under the project's license.
    validations:
      required: true
