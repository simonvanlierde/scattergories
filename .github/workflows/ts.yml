name: ts

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  # Monthly, so the browser matrix also runs while no pull request is open.
  schedule:
    - cron: '24 4 1 * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: "ts: lint, types, tests"
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # The jsdom integration tests mount the full category list and need the headroom.
    timeout-minutes: 15
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # The pnpm store is cached by hand: setup-node's cache saves on every event and has
      # no switch to stop that. A cache a pull request saves is readable by that pull
      # request alone, and it pushes main's entries out of the 10 GB per-repo limit, so
      # pull requests only restore.
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-check-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-check-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - if: github.event_name != 'pull_request' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      # The e2e container's tag must match the installed Playwright exactly, so it
      # is read from the package the lockfile resolved, not kept in sync by hand.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - run: pnpm run check
      - run: pnpm run typecheck
      - run: pnpm run coverage --coverage.reporter=lcov

      # Dependabot pull requests get no secrets, so their upload fails without failing CI.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: ts
      - run: pnpm run build
      - run: pnpm run budget
      # Known advisories, moderate and up, in what ships: dependencies, not dev tooling.
      - run: pnpm audit --prod --audit-level=moderate

  e2e:
    name: e2e (chromium)
    needs: check
    runs-on: ubuntu-latest
    # Chromium runs every spec; Firefox, WebKit and the mobile projects run the @smoke ones.
    timeout-minutes: 25
    env:
      # Firefox refuses to launch as root when $HOME belongs to another user.
      HOME: /root
    # The browser and its system libraries come with the image, at the version the
    # check job read from the lockfile, so a Playwright bump needs no edit here. That
    # tag comes from the lockfile, so no digest can be pinned next to it.
    container:
      # jactionlint ignore=unpinned-images
      image: mcr.microsoft.com/playwright:v${{ needs.check.outputs.playwright }}-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Without a Latin font, the image falls back to a CJK font whose narrow Latin
      # glyphs can hide text that overflows with the fonts real browsers use.
      - run: apt-get update && apt-get install -y --no-install-recommends fonts-dejavu-core

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # Cached by hand, saved off pull requests only, as in the check job. The container's
      # store path differs from the runner's, so this is a cache of its own.
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-e2e-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - if: github.event_name != 'pull_request' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - run: pnpm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
