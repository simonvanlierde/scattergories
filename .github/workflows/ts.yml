name: ts

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  # Monthly, so the browser matrix also runs while no pull request is open.
  schedule:
    - cron: '24 4 1 * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull requests only: a newer push to main must not cancel a production deploy in flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: "ts: lint, types, tests"
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # The jsdom integration tests mount the full category list and need the headroom.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # The pnpm store is cached by hand: setup-node's cache saves on every event and has
      # no switch to stop that. A cache a pull request saves is readable by that pull
      # request alone, and it pushes main's entries out of the 10 GB per-repo limit, so
      # pull requests only restore.
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-check-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-check-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - if: github.event_name != 'pull_request' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      - run: pnpm run check
      - run: pnpm run typecheck
      - run: pnpm run coverage --coverage.reporter=lcov

      # Dependabot pull requests get no secrets, so their upload fails without failing CI.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: ts
      - run: pnpm run build
      - run: pnpm run budget
      # Fails on a production dependency whose license MIT cannot take. shortcut: the
      # Python tools in tools/ are dev-only and not shipped, so uv licenses are not
      # checked (uv has no license listing); add pip-licenses if tools/ ever ships.
      - run: pnpm run licenses

      # The preview and production jobs deploy this build, so they ship what the checks ran on.
      - if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          # dist/.well-known/security.txt is a hidden path; the default skips it.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      # Known advisories, moderate and up, in what ships: dependencies, not dev tooling.
      - run: pnpm audit --prod --audit-level=moderate
      # Lists the license of each package that ships (dependencies, not dev tooling) and
      # fails on one MIT cannot take. The allow-list is in scripts/checkLicenses.mjs.
      - run: pnpm run licenses

  # The e2e container's tag must match the locked Playwright exactly. A job of its own reads it,
  # so e2e starts beside check instead of waiting for all of it.
  playwright:
    name: "ts: playwright version"
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false
      - id: version
        run: |
          version=$(grep -oPm1 "^  '@playwright/test@\K[0-9.]+(?=':)" pnpm-lock.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  e2e:
    name: e2e (chromium)
    needs: playwright
    runs-on: ubuntu-latest
    # Chromium runs every spec; Firefox, WebKit and the mobile projects run the @smoke ones.
    timeout-minutes: 25
    env:
      # Firefox refuses to launch as root when $HOME belongs to another user.
      HOME: /root
    # The browser and its system libraries come with the image, at the version the
    # playwright job read, so a Playwright bump needs no edit here and no digest can sit beside it.
    container:
      # jactionlint ignore=unpinned-images
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Without a Latin font, the image falls back to a CJK font whose narrow Latin
      # glyphs can hide text that overflows with the fonts real browsers use.
      - run: apt-get update && apt-get install -y --no-install-recommends fonts-dejavu-core

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # Cached by hand, saved off pull requests only, as in the check job. The container's
      # store path differs from the runner's, so this is a cache of its own.
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-e2e-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - if: github.event_name != 'pull_request' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - run: pnpm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # docs/architecture.md#deployment has the preview lifecycle. Fork pull requests never get
  # the token, so they skip with a notice, as does a repo without the secret.
  preview:
    name: preview
    # Bot pull requests (Renovate, Dependabot, the update App) get no preview, and a bot's
    # push does not start one. A person's later ready or reopen deploys the head as it is.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && github.head_ref != 'chore/copier-update' && !endsWith(github.event.pull_request.user.login, '[bot]') && !endsWith(github.actor, '[bot]')
    # Shares the retire job's group, so a retire waits for a deploy in flight.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/cloudflare-gate.sh" Preview'

      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Search engines should index the production site, not the preview copies. This
      # block is appended to the build's own _headers, which keeps its security headers.
      - if: steps.gate.outputs.run == 'true'
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex\n' >> dist/_headers

      # This job may have queued behind a close or a draft switch: a retire that
      # ran first must not be undone by a deploy. This step alone holds GH_TOKEN, so the
      # deploy step, which holds the Cloudflare token, never gets it.
      - if: steps.gate.outputs.run == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |-
          state=$(gh api "repos/$REPO/pulls/$PR" --jq '.state + " " + (.draft|tostring)')
          if [ "$state" != "open false" ]; then
            echo "::notice::Preview skipped: pull request $PR is no longer open and ready ($state)."
            echo "open=false" >>"$GITHUB_OUTPUT"
          else
            echo "open=true" >>"$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.run == 'true' && steps.pr.outputs.open == 'true'
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
        run: |-
          "$GITHUB_WORKSPACE/.github/scripts/deploy-worker.sh" Preview "scattergories-pr-$PR"

  # Production: every push to main deploys the build the checks ran on. Without the
  # token, it skips with a notice.
  production:
    name: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Never cancelled halfway, so a deploy in flight finishes before the next starts.
    concurrency:
      group: production
      cancel-in-progress: false
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/cloudflare-gate.sh" "Production deploy"'

      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # Keep the duplicate workers.dev origin out of search results.
      - if: steps.gate.outputs.run == 'true'
        run: |
          printf '\nhttps://:worker.:subdomain.workers.dev/*\n  X-Robots-Tag: noindex\n' >> dist/_headers
      - if: steps.gate.outputs.run == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --domain attaches the custom domain here only: previews deploy the same config.
        run: '"$GITHUB_WORKSPACE/.github/scripts/deploy-worker.sh" Production "" --domain scattergories.duinlab.nl'
