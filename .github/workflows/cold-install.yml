name: cold install

# Runs the README's setup commands in a container that has none of the tools it asks
# for, so a step the README leaves out fails here before it fails a new contributor.
# Mirrors the Quick start (`pnpm install`, `pnpm build`) and the tools/ setup; `pnpm dev`
# is left out because it never exits.
on:
  pull_request:
    paths: [README.md, .github/workflows/cold-install.yml, package.json, pnpm-lock.yaml, "tools/pyproject.toml", "tools/uv.lock", .node-version]
  schedule:
    - cron: "47 5 * * 1" # Mondays, 05:47 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # As in python.yml: uv checks every package against OSV's malware advisories.
  UV_MALWARE_CHECK: "1"
  UV_PREVIEW_FEATURES: malware-check

jobs:
  readme:
    name: README setup, fresh container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # cspell:ignore trixie
    # Debian with git, curl and a C compiler, like a new contributor's machine. Pinned
    # to a digest, so a moved tag can't swap the image.
    container: buildpack-deps:trixie@sha256:5214476af627916270063c9f99a969381f32cd961c861ea95e740ba71abc125f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The weekly run saves the cache; a pull request only reads it.
          save-cache: ${{ github.event_name != 'pull_request' }}
          version: "0.13.6"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # The runner's user owns the checkout and this container runs as root, so git
      # refuses the repository as "dubious ownership".
      - run: chown -R "$(id -u):$(id -g)" .
      - run: pnpm install
      - run: pnpm build
      - run: uv --directory tools sync
      - run: uv --directory tools run sg-tools weights verify
