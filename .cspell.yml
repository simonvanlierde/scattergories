version: "0.2"
language: en
dictionaries:
  - cpp-compound-words
  - filetypes
  - npm
  - python-common
  - software-tools
  - softwareTerms

import:
  - "@cspell/dict-de-de/cspell-ext.json"
  - "@cspell/dict-es-es/cspell-ext.json"
  - "@cspell/dict-fr-fr/cspell-ext.json"
  - "@cspell/dict-it-it/cspell-ext.json"
  - "@cspell/dict-nl-nl/cspell-ext.json"
  - "@cspell/dict-pl_pl/cspell-ext.json"
  - "@cspell/dict-pt-br/cspell-ext.json"
  - "@cspell/dict-el/cspell-ext.json"

# Include hidden files
enableGlobDot: true

# Exclude files in .gitignore
useGitignore: true
ignorePaths:
  - ".git"
  - "*-lock.*"
  - ".vscode/**"
  # SVG markup is a sea of attribute names, not prose.
  - "**/*.svg"

# Check locale and translation files in their respective languages.
overrides:
  - filename: "**/{de,*.de}.json"
    language: en,de
  - filename: "**/{es,*.es}.json"
    language: en,es
  - filename: "**/{fr,*.fr}.json"
    language: en,fr
  - filename: "**/{it,*.it}.json"
    language: en,it
  - filename: "**/{nl,*.nl}.json"
    language: en,nl
  - filename: "**/{pl,*.pl}.json"
    language: en,pl
  - filename: "**/{pt,*.pt}.json"
    language: en,pt
  - filename: "**/{el,*.el}.json"
    language: en,el
  # Boot screen strings for every locale, bundled before the locale files load.
  - filename: "src/app/{bootMessages.ts,App.boot.test.tsx}"
    language: en,de,es,fr,it,nl,pl,pt,el

words:
  - Lierde
  - scattergories
  - duinlab
  - Wikitext
  # Codecov setting
  - carryforward
  # Fonts
  - Avenir
  - Fraunces
  # Biome rule name
  - Filenaming
  # Common technical terms
  - backgrounded
  - CICD
  - geolocation
  - precaching
  - undecomposed
  - oklch
  - htmlcov
  - nosniff
  - playmat
  - tmpfs
  - WCAG
  - unmute
  - zstd
  # Translated UI strings (compound / inflected forms the language dicts lack)
  - Rundentimer
  - Rondetimer
  - Partyspiel
  - επαναφόρτωση
  - gelote
  # Native language names shown in UI language picker
  - Deutsch
